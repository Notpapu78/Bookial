<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<!-- Css styles -->
	<link rel="stylesheet" href="../css/!aesthethic.css">
	<link rel="stylesheet" href="../css/!structure.css">
	<link rel="stylesheet" href="../css/login.css">
	<!-- Boostrap icons -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
	<title>Bookial</title>
</head>
<body>
	<header>
		<div>
			<img src="../images/icon.png" alt="Icon" style="width: 10rem; height: 9.5rem;">
			<h1>&nbsp&nbsp&nbsp&nbsp&nbsp</h1>
			<h1>Bookial Registro</h1>
		</div>
	</header>

	<nav>
		<h2>Menú</h2>
		<div>
			<a>Página Principal</a>
		</div>
		<div>
			<p>Acceder</p>
		</div>

		<!-- Appears only when logged in -->
		<div>
			<a>Calendario</a>
		</div>
		<div id="log-out">
			<p class="bi bi-box-arrow-in-right"></p>
			<a>Cerrar Sesión</a> <!-- Should appear at the end of the nav -->
		</div>
	</nav>

	<main>
		
		<fieldset>
			<form action="">
				<div>
					<label for="form-name">Nombre: </label>
					<input type="text" name="form-name" placeholder="Alonso" required>
					<br>
				</div>
				
				<div>
					<label for="form-surname">Apellidos: </label>
					<input type="text" name="form-surname" placeholder="Alfaro Gonzalez" style="width: 32rem; height: 3.2rem;" required>
					<br>
				</div>
				
				<div>
					<label for="form-email">Email: </label>
					<input type="text" name="form-email" placeholder="a.alfarogonzalez@liceorbl.cl" required>
					<br>
				</div>
				
				<div>
					<label for="form-cargo">Cargo: </label>
					<select name="form-cargo" style="width: 32rem; height: 3.2rem;">
						<option>Atun</option>
						<option>Merluza</option>
						<option>Sardina</option>
					</select>
				</div>

			</form>
		</fieldset>

	</main>

	<footer>
		<h3>&copy;2026 Mase Corp. Todos los derechos reservados.</h3>
		<p>Contacto: Bookial@protonmail.com</p>
	</footer>
</body>
</html>
