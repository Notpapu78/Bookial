<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Esteban">
  <link rel="stylesheet" href="../css/!general.css">
  <title>Muestrario</title>
</head>
<body>
	<fieldset>
		<form action="">
			<div>
				<label for="cardreader">Credit Card: </label>
				<input type="number" name="cardreader" id="cardreader" placeholder="Your credit card number goes here" style="width: 32rem;" required>
				<br>
			</div>
		</form>

		<form action="">
			<div>
				<label for="numberreader">3 Numbers: </label>
				<input type="password" name="numberreader" id="numberreader" placeholder="The 3 numbers on the back go here (don't worry it's a password)" style="width: 40rem;" required>
				<br>
			</div>
		</form>

		<form action="">
			<div>
				<label for="expirationreader">Expiration Date: </label>
				<input type="date" name="expirationreader" id="expirationreader" style="width: 16rem;" required>
				<br>
			</div>
		</form>

		<form action="">
			<div>
				<input type="radio" name="bankreader" id="bankreader" value="BancoEstado;">
				<label for="bankreader">BancoEstado </label><br>
				<input type="radio" name="bankreader" id="bankreader" value="BancoChile;">
				<label for="bankreader">BancoChile </label><br>
				<input type="radio" name="bankreader" id="bankreader" value="Santander;" required>
				<label for="bankreader">Santander </label><br>
				<br>
			</div>
		</form>

		<form action="">
			<div>
				<label for="moneyreader">Do you have a lot of money? </label>
				<input type="checkbox" name="moneyreader" id="moneyreader" required><br>

				<label for="moneyreader">Do you have any valuable belongings? </label>
				<input type="checkbox" name="moneyreader" id="moneyreader" required>
				<br>
			</div>
		</form>

		<form action="">
			<div>
				<label for="addressreader">Your Address: </label>
				<input type="number" name="addressreader" id="addressreader" placeholder="Your address goes here" style="width: 32rem;" required>
				<br>
			</div>
		</form>


		<form action="">
			<div>
				<label for="ipreader">At what hours of the day are you outside your house? </label>
				<input type="text" name="ipreader" id="ipreader" placeholder="Time goes here" style="width: 32rem;">
				<br>
			</div>
		</form>

		<div>
			<br>
			<label for="valuableitemsarea">Type all the valuable belongings in your home and their locations</label><br>
			<textarea name="Valuable items" id="valuableitemsarea" cols="80" rows="8"></textarea>
		</div>

		<div>
			<select name="comida" id="comida">
				<option>Atun</option>
				<option>Merluza</option>
				<option>Sardina</option>
			</select>
		</div>

		<div>
			<label for="epstein_files">Release the Files</label>
			<input type="file" id="epstein_files" name="epstein_files">
		</div>

		<div>
			<form action="/process_epstein_files" method="post" enctype="multipart/form-data"></form>
			<input type="submit" value="Post">
		</div>
	</fieldset>

</body>
</html>
